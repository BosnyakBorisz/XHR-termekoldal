<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termékoldal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root { --ink: #101c2a; --muted: #596777; --line: #e1e7ed; --blue: #0876ed; }
        body { color: var(--ink); background: #fff !important; }
        main.container { max-width: 1440px; }
        .termek-galeria { display: flex; gap: .75rem; align-items: stretch; }
        #termek-kepe { flex: 1; min-width: 0; aspect-ratio: 1.46; object-fit: cover; border: 1px solid var(--line); background: #f3f5f7; }
        #indexkepek { width: 94px; flex: 0 0 94px; }
        .indexkep { display: block; width: 100%; aspect-ratio: 1.2; object-fit: cover; border: 1px solid var(--line); border-radius: 5px; background: #f3f5f7; }
        #termek-neve { color: var(--ink); font-size: 1.85rem; font-weight: 750; }
        #termek-leirasa { color: var(--muted) !important; }
        #termek .badge { background: var(--blue) !important; }
        #termek-ara { color: var(--ink) !important; font-size: 2rem; font-weight: 750; }
        #keszlet-szoveg { display: inline-block; padding: .5rem .75rem; border-radius: 6px; background: #dcf5e7; color: #087a3b; font-weight: 650; }
        #termek .text-warning { color: #f2a900 !important; letter-spacing: 1px; }
        #termek .btn-primary { background: var(--blue); border-color: var(--blue); font-weight: 650; }
        #termek .btn-outline-secondary { color: #344152; border-color: #d7dee6; font-weight: 600; }
        .product-meta { border: 1px solid var(--line); border-radius: 6px; background: #f8fafb; }
        .product-meta small { color: var(--muted) !important; }
        #termek .nav-tabs { border-color: var(--line); }
        #termek .nav-tabs .nav-link { color: #465464; border: 0; border-bottom: 2px solid transparent; }
        #termek .nav-tabs .nav-link.active { color: var(--blue); border-bottom-color: var(--blue); background: transparent; font-weight: 650; }
        #termek .row.mt-1 { --bs-gutter-x: 0; }
        #termek .row.mt-1 > section { padding: .5rem 1.25rem; }
        #termek .row.mt-1 > section + section { border-left: 1px solid var(--line); }
        #hosszu-leiras { color: #465464 !important; line-height: 1.55; }
        #leiras .border { border-color: transparent !important; background: #f3f6f9 !important; color: #263445 !important; min-height: 92px; display: grid; place-items: center; font-weight: 550; }
        #tulajdonsag-lista .list-group-item, #velemeny-lista .list-group-item { border: 1px solid var(--line); background: #fff; }
        #tulajdonsag-lista .list-group-item + .list-group-item, #velemeny-lista .list-group-item + .list-group-item { border-top: 0; }
        #tulajdonsag-lista .list-group-item:first-child, #velemeny-lista .list-group-item:first-child { border-radius: 6px 6px 0 0; }
        #tulajdonsag-lista .list-group-item:last-child, #velemeny-lista .list-group-item:last-child { border-radius: 0 0 6px 6px; }
        @media (max-width: 991.98px) {
            #termek .row.mt-1 > section + section { border-left: 0; }
            #termek .row.mt-1 > section { padding: .75rem; }
        }
        @media (max-width: 767.98px) {
            .termek-galeria { flex-direction: column; }
            #indexkepek { width: 100%; flex: none; flex-direction: row !important; }
            .indexkep { flex: 1; min-width: 0; }
            #termek-neve { font-size: 1.55rem; }
        }
    </style>
</head>
<body class="bg-light">
<main class="container py-4">
    <div id="betoltesi-hiba" class="alert alert-danger" role="alert" hidden></div>
    
    <section id="termek" aria-live="polite" aria-busy="true">
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-6">
                <div class="termek-galeria">
                    <img id="termek-kepe" class="img-fluid rounded" src="" alt="Termék képe">
                    <div id="indexkepek" class="d-flex flex-column gap-2"></div>
                </div>
            </div>
            
            <div class="col-12 col-md-6 col-lg-4">
                <span class="badge bg-danger mb-2">ÚJ</span>
                <h1 id="termek-neve" class="h2">Termék betöltése…</h1>
                <p id="termek-leirasa" class="text-muted"></p>
                
                <div class="d-flex align-items-center gap-2 mb-3">
                    <span class="text-warning">★★★★★</span>
                    <span id="ertekeles" class="text-muted small"></span>
                </div>
                
                <h3 id="termek-ara" class="text-primary mb-3"></h3>
                <div id="keszlet-szoveg" class="mb-3"></div>
                
                <div class="d-flex gap-2">
                    <button class="btn btn-primary flex-grow-1 py-2" type="button">Kosárba</button>
                    <button class="btn btn-outline-secondary flex-grow-1 py-2" type="button">♡ Kedvencekhez</button>
                </div>
            </div>
            
            <div class="col-12 col-lg-2">
                <div class="product-meta p-3">
                    <div class="mb-2"><small class="text-muted d-block">Gyártó</small><span id="gyarto"></span></div>
                    <div class="mb-2"><small class="text-muted d-block">Származási ország</small><span id="orszag"></span></div>
                    <div class="mb-2"><small class="text-muted d-block">Garancia</small><span id="garancia">2 év</span></div>
                    <div><small class="text-muted d-block">Szállítás</small><span id="szallitas">1-3 munkanap</span></div>
                </div>
            </div>
        </div>
        
        <nav class="nav nav-tabs mt-5">
            <a class="nav-link active" href="#leiras">Leírás</a>
            <a class="nav-link" href="#tulajdonsagok">Tulajdonságok</a>
            <a class="nav-link" href="#velemenyek">Vélemények (<span id="velemenyek-szama">0</span>)</a>
        </nav>
        
        <div class="row g-4 mt-1">
            <section id="leiras" class="col-12 col-lg-6">
                <p id="hosszu-leiras" class="text-muted"></p>
                <div class="row g-2 text-center text-secondary small">
                    <div class="col-6 col-sm-3"><div class="p-2 border rounded bg-white">Kiemelkedő teljesítmény</div></div>
                    <div class="col-6 col-sm-3"><div class="p-2 border rounded bg-white">Tökéletes játékélmény</div></div>
                    <div class="col-6 col-sm-3"><div class="p-2 border rounded bg-white">Lenyűgöző kijelző</div></div>
                    <div class="col-6 col-sm-3"><div class="p-2 border rounded bg-white">Ideális fejlesztéshez</div></div>
                </div>
            </section>
            
            <section id="tulajdonsagok" class="col-12 col-md-6 col-lg-3">
                <h4 class="h6 fw-bold">Főbb jellemzők</h4>
                <ul id="tulajdonsag-lista" class="list-group list-group-flush"></ul>
            </section>
            
            <section id="velemenyek" class="col-12 col-md-6 col-lg-3">
                <h4 class="h6 fw-bold">Vásárlói vélemények</h4>
                <ul id="velemeny-lista" class="list-group list-group-flush"></ul>
                <a class="d-block mt-3 text-decoration-none small" href="#velemenyek">Összes vélemény megtekintése →</a>
            </section>
        </div>
    </section>
</main>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
